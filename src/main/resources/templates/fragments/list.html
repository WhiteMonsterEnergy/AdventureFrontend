<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<section th:fragment="list" class="activities-section">
    <div class="container">
        <h2>Vores aktiviteter</h2>
        <ul class="activity-grid" id="activityGrid">
            <li class="activity-card">
                <h3>Minigolf</h3>
                <p>18 huller i varierende sværhedsgrad.</p>
                <span class="tag">Familie</span>
            </li>
            <li class="activity-card">
                <h3>Escape Room</h3>
                <p>Løs gåder på tid i tema-rum.</p>
                <span class="tag">Hold</span>
            </li>
            <li class="activity-card">
                <h3>Bowling</h3>
                <p>Moderne baner og loungeområde.</p>
                <span class="tag">Social</span>
            </li>
            <li class="activity-card">
                <h3>Laser Tag</h3>
                <p>Hurtig action med vest og blaster.</p>
                <span class="tag">Action</span>
            </li>
        </ul>
    </div>
</section>
</html>
