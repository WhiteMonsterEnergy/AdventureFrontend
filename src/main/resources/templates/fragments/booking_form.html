<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<form th:fragment="booking_form" action="/submit-booking" method="post" class="booking-form">
    <fieldset>
        <legend>Aktivitet & tidspunkt</legend>
        <div class="field">
            <label for="activity">Aktivitet</label>
            <select id="activity" name="activity" required>
                <option value="" disabled selected>Vælg aktivitet</option>
                <option value="minigolf">Minigolf</option>
                <option value="escape-room">Escape Room</option>
                <option value="bowling">Bowling</option>
                <option value="laser-tag">Laser Tag</option>
            </select>
        </div>
        <div class="field two-col">
            <div>
                <label for="date">Dato</label>
                <input id="date" name="date" type="date" required>
            </div>
            <div>
                <label for="timeslot">Tidsrum</label>
                <select id="timeslot" name="timeslot" required>
                    <option value="" disabled selected>Vælg</option>
                    <option>10:00</option>
                    <option>12:00</option>
                    <option>14:00</option>
                    <option>16:00</option>
                    <option>18:00</option>
                </select>
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>Deltagere</legend>
        <div class="field two-col">
            <div>
                <label for="participants">Antal</label>
                <input id="participants" name="participants" type="number" min="1" max="60" required>
            </div>
            <div>
                <label for="groupType">Gruppetype</label>
                <select id="groupType" name="groupType" required>
                    <option value="" disabled selected>Vælg</option>
                    <option value="privat">Privat</option>
                    <option value="firma">Firma</option>
                    <option value="skole">Skole</option>
                    <option value="forening">Forening</option>
                </select>
            </div>
        </div>
        <div class="field">
            <label>Aldersgrupper</label>
            <div class="inline-check">
                <label><input type="checkbox" name="ageGroup" value="u12"> U12</label>
                <label><input type="checkbox" name="ageGroup" value="13-17"> 13-17</label>
                <label><input type="checkbox" name="ageGroup" value="18+"> 18+</label>
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>Kontakt</legend>
        <div class="field two-col">
            <div>
                <label for="name">Navn</label>
                <input id="name" name="name" type="text" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </div>
        </div>
        <div class="field two-col">
            <div>
                <label for="phone">Telefon</label>
                <input id="phone" name="phone" type="tel" pattern="[0-9 +]{6,}" required>
            </div>
            <div>
                <label for="note">Note (valgfri)</label>
                <input id="note" name="note" type="text" placeholder="Evt. kommentar">
            </div>
        </div>
    </fieldset>

    <div class="field terms">
        <label>
            <input type="checkbox" name="terms" required>
            Jeg accepterer vilkår og betingelser.
        </label>
    </div>

    <div class="actions">
        <button type="submit" class="btn primary">Bekræft booking</button>
    </div>
</form>

</html>
