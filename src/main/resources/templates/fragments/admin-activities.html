<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="activitymanagement">
  <section class="container">
    <h2>Administrér aktiviteter</h2>

    <div class="admin-list">
      <article class="activity-row">
        <div class="row-main">
          <h3>Minigolf</h3>
          <p>18 huller</p>
        </div>
        <div class="row-actions">
          <a class="btn" href="#">Redigér</a>
        </div>
      </article>
    </div>

    <section class="admin-card" id="editor">
      <h3>Ny aktivitet</h3>
      <form class="admin-form">
        <div class="field two-col">
          <div>
            <label for="a-name">Navn</label>
            <input id="a-name" type="text" required>
          </div>
          <div>
            <label for="a-category">Kategori</label>
            <select id="a-category" required>
              <option value="" disabled selected>Vælg</option>
              <option>Familie</option>
              <option>Action</option>
              <option>Hold</option>
              <option>Social</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" type="submit">Gem</button>
        </div>
      </form>
    </section>
  </section>
</div>
</html>
