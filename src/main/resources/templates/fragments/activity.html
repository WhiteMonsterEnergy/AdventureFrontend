<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="activityPage">
  <section class="container">
    <h2>Aktiviteter</h2>

    <div th:insert="~{fragments/activity :: activityAdmin}"></div>

    <div th:insert="~{fragments/activity :: activityList}"></div>

  </section>
  <script src="/javascript/activity.js"></script>
</div>

<section th:fragment="cards" class="activities-section">
  <div class="container">
    <h2>Vores aktiviteter</h2>
    <ul class="activity-grid" id="activityGrid">
      <!-- filled by js -->
    </ul>
  </div>
</section>

<div th:fragment="activityList">
  <ul class="admin-list" id="activityList">
    <li class="activity-row">
      <!-- filled by js -->
    </li>
  </ul>
</div>

<div th:fragment="activityAdmin" class="admin">
  <section class="admin-card" id="editor">
    <h3>Ny aktivitet</h3>
    <form class="admin-form" id="activityForm">
      <div class="field two-col">
        <div>
          <label for="af_name">Navn</label>
          <input id="af_name" type="text" required>
        </div>
        <div>
          <label for="af_desc">Beskrivelse</label>
          <input id="af_desc" type="text" required>
        </div>
        <div>
          <label for="af_price">Pris per Person</label>
          <input id="af_price" type="number" step="0.01" required>
        </div>
        <div>
          <label for="af_time">Tid per Session i minutter</label>
          <input id="af_time" type="number" required>
        </div>
        <div>
          <label for="af_cap">Max Deltagere</label>
          <input id="af_cap" type="number" required>
        </div>
        <div>
          <label for="af_age">Aldersgrænse</label>
          <select id="af_age">
            <option value="" selected>Ingen</option>
            <option value="18">18+</option>
            <option value="12">12+</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" type="submit">Opret</button>
      </div>
    </form>
  </section>
</div>

</html>
