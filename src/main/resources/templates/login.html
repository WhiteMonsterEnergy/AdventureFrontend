<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<form th:fragment="loginPrompt" th:action="@{/OmdirigerLogind}" method="get" style="display: table-caption;">
    <label>
        Username:
        <input type="text" id="usernameInp" autofocus="autofocus" required/>
    </label><br/>
    <label>
        Password:
        <input type="password" id="passwordInp" required />
    </label><br/>
    <input id="loginBtn" type="submit" value="Log In" />
</form>

</html>
